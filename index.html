<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiếm Lúa Online</title>
<style>
body{background:#05091b;color:white;font-family:sans-serif;text-align:center;padding:50px 20px}
.box{background:#111a30;padding:25px;border-radius:20px;border:1px solid #233258;max-width:400px;margin:auto}
.btn{background:#315cf5;color:white;border:0;border-radius:12px;padding:15px;width:100%;font-weight:bold;font-size:16px;margin-top:15px;display:block;text-decoration:none}
</style>
</head>
<body>

<div class="box">
    <h2>🌾 KIẾM LÚA ONLINE</h2>
    <p>Chào mừng bạn! Nhấn nút bên dưới để chuyển sang chế độ đăng ký.</p>
    
    <button class="btn" id="testBtn" onclick="alert('Tuyệt vời! Nút bấm đã hoạt động mượt mà 100%!')">Thử bấm vào đây</button>
</div>

</body>
</html>
